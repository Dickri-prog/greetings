<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Spesial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        
        /* Animasi sederhana */
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative">
        <!-- Aksen Dekoratif -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-gray-800 to-gray-600"></div>
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-gray-100 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-slate-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>

        <div class="p-8 relative z-10 text-center space-y-6">
            <!-- Header -->
            <div class="fade-in-up">
                <p class="text-xs font-medium tracking-[0.2em] text-gray-500 uppercase mb-3">You Are Invited</p>
                <h1 class="font-playfair text-4xl font-semibold text-gray-800">Special Event</h1>
            </div>

            <div class="w-12 h-px bg-gray-300 mx-auto fade-in-up delay-100"></div>

            <!-- Konten -->
            <div class="fade-in-up delay-200 space-y-5">
                <p class="text-gray-600 font-light leading-relaxed text-sm">
                    Kami dengan senang hati mengundang Anda untuk bergabung dalam momen spesial ini. Kehadiran Anda akan sangat berarti bagi kami.
                </p>
                
                <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 shadow-inner">
                    <div class="font-playfair text-lg text-gray-800 font-medium">Sabtu, 28 November 2026</div>
                    <div class="text-sm text-gray-500 mt-1">10:00 WIB - Selesai</div>
                    <div class="text-sm text-gray-800 mt-3 font-medium">Grand Ballroom, Situraja</div>
                </div>
            </div>

            <!-- Call to Action -->
            <div class="fade-in-up delay-300 pt-2">
                <a href="#" class="inline-block w-full px-6 py-3.5 bg-gray-900 text-white text-sm font-medium rounded-xl hover:bg-gray-800 transition duration-300 transform hover:-translate-y-1 hover:shadow-lg">
                    Konfirmasi Kehadiran (RSVP)
                </a>
            </div>
        </div>
    </div>

</body>
</html>
